name = "Aggressor Script"
grammar = "aggressor"
path_suffixes = ["cna"]
line_comments = ["# "]
tab_size = 4
autoclose_before = ";:.,=}])"
word_characters = ["$", "@", "%", "&", "_"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
